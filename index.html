<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stellar Command - a responsive space agency strategy game with solo, rival AI, and same-WiFi LAN play.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stellar Command">
  <title>Stellar Command - Space Agency Management Game</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- Font Preload -->
  <link rel="preload" href="/fonts/orbitron-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/orbitron-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/roboto-mono-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="/" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/crew.css">
  <link rel="stylesheet" href="./styles/tutorial.css">

  <style>
    @font-face {
      font-family: 'Orbitron';
      src: url('/fonts/orbitron-bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: 'Orbitron';
      src: url('/fonts/orbitron-regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Roboto Mono';
      src: url('/fonts/roboto-mono-regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background-color: #000000;
      background: #101828;
      font-family: 'Orbitron', 'Roboto Mono', system-ui, sans-serif;
      color: #f8fafc;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #game-container {
      width: 100%;
      min-height: 100%;
      position: relative;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="starfield"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
