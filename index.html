<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stellar Command - A space agency management game where players control a space agency, manage missions, and explore the cosmos">
  <meta name="theme-color" content="#000000">
  <title>Stellar Command - Space Agency Management Game</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- Font Preload -->
  <link rel="preload" href="/fonts/orbitron-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/orbitron-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/roboto-mono-regular.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Google Font: Press Start 2P for pixel game aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- Core theme and glassmorphism styles -->
  <link rel="stylesheet" href="./styles/main.css">

  <style>
    @font-face {
      font-family: 'Orbitron';
      src: url('/fonts/orbitron-bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: 'Orbitron';
      src: url('/fonts/orbitron-regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Roboto Mono';
      src: url('/fonts/roboto-mono-regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Orbitron', 'Roboto Mono', monospace;
      color: #00ff00;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="starfield"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
