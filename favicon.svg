<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark space background -->
  <rect width="100" height="100" fill="#000000"/>

  <!-- Stars -->
  <circle cx="20" cy="20" r="1.5" fill="#00ff00"/>
  <circle cx="80" cy="15" r="1" fill="#00ff00"/>
  <circle cx="85" cy="70" r="1.5" fill="#00ff00"/>
  <circle cx="15" cy="85" r="1" fill="#00ff00"/>

  <!-- Central planet/star -->
  <circle cx="50" cy="50" r="20" fill="#00ff00" opacity="0.8"/>
  <circle cx="50" cy="50" r="15" fill="#00ff00" opacity="0.5"/>

  <!-- Orbital rings -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.6"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.4"/>
</svg>
